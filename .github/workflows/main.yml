name: Build Barq P2P APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب الملفات
        uses: actions/checkout@v4

      - name: فك ضغط المشروع وإصلاح الإعدادات
        run: |
          unzip -q -o "*.zip"
          if [ -f ".env.example" ]; then cp .env.example .env; else touch .env; fi
          sed -i '/signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts
          sed -i '/kotlin.compiler.execution.strategy/d' gradle.properties
          sed -i '/org.gradle.configuration-cache/d' gradle.properties

      - name: إعداد Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: تثبيت محرك Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: بناء ملف الـ APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache

      - name: رفع ملف الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Barq-P2P-5GHz-APK
          path: app/build/outputs/apk/debug/*.apk
          
